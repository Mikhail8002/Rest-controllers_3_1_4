<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль пользователя</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .profile-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .profile-header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
        }

        .profile-header h1 {
            color: #333;
            font-size: 28px;
            font-weight: 700;
        }

        .profile-header .subtitle {
            color: #888;
            font-size: 14px;
            margin-top: 5px;
        }

        .avatar {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 40px;
            color: white;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 10px 0;
            margin: 20px 0;
        }

        .info-label {
            font-weight: 600;
            color: #555;
            padding: 12px 15px;
            background: #f8f9fa;
            border-radius: 8px 0 0 8px;
            display: flex;
            align-items: center;
        }

        .info-label i {
            margin-right: 8px;
        }

        .info-value {
            padding: 12px 15px;
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 0 8px 8px 0;
            display: flex;
            align-items: center;
            color: #333;
            word-break: break-word;
        }

        .info-value .role-badge {
            background: #667eea;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            margin: 2px 4px;
            display: inline-block;
        }

        .info-value .role-badge.admin {
            background: #f44336;
        }

        .info-value .role-badge.user {
            background: #4CAF50;
        }

        .info-value .no-roles {
            color: #f44336;
            font-style: italic;
        }

        .actions {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 25px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-danger {
            background: #f44336;
            color: white;
        }

        .btn-danger:hover {
            background: #d32f2f;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(244, 67, 54, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
            transform: translateY(-2px);
        }

        .btn-success {
            background: #4CAF50;
            color: white;
        }

        .btn-success:hover {
            background: #388E3C;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(76, 175, 80, 0.4);
        }

        .error-message {
            text-align: center;
            color: #f44336;
            padding: 30px;
            font-size: 16px;
        }

        .error-message i {
            font-size: 48px;
            display: block;
            margin-bottom: 15px;
        }

        @media (max-width: 600px) {
            .profile-container {
                padding: 20px;
            }

            .info-grid {
                grid-template-columns: 1fr;
                gap: 5px;
            }

            .info-label {
                border-radius: 8px 8px 0 0;
            }

            .info-value {
                border-radius: 0 0 8px 8px;
                border-top: none;
            }

            .actions {
                flex-direction: column;
            }

            .actions .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

<div class="profile-container">
    <!-- Шапка профиля -->
    <div class="profile-header">
        <div class="avatar" th:text="${user != null ? user.username.substring(0, 1).toUpperCase() : '?'}"></div>
        <h1 th:text="${user != null ? user.firstName + ' ' + user.lastName : 'Профиль пользователя'}"></h1>
        <div class="subtitle" th:text="${user != null ? '@' + user.username : 'Данные недоступны'}"></div>
    </div>

    <!-- Информация о пользователе -->
    <div th:if="${user != null}">
        <div class="info-grid">
            <div class="info-label">🆔 ID</div>
            <div class="info-value" th:text="${user.id}"></div>

            <div class="info-label">👤 Имя пользователя</div>
            <div class="info-value" th:text="${user.username}"></div>

            <div class="info-label">📛 Имя</div>
            <div class="info-value" th:text="${user.firstName}"></div>

            <div class="info-label">📛 Фамилия</div>
            <div class="info-value" th:text="${user.lastName}"></div>

            <div class="info-label">🎂 Возраст</div>
            <div class="info-value" th:text="${user.age}"></div>

            <div class="info-label">📧 Email</div>
            <div class="info-value" th:text="${user.email}"></div>



        <!-- Действия -->
        <div class="actions">

            <a href="/logout" class="btn btn-danger">🚪 Выйти</a>
        </div>
    </div>

    <!-- Сообщение об ошибке -->
    <div th:if="${user == null}" class="error-message">
        <div>😔</div>
        <p>Данные пользователя недоступны</p>
        <a href="/login" class="btn btn-primary" style="margin-top: 15px;">🔐 Войти</a>
    </div>
</div>

</body>
</html>
