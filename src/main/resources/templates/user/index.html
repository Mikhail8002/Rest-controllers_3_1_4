<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль пользователя</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .profile-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 700px;
            width: 100%;
        }
        .profile-card h2 {
            color: #333;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .profile-card .subtitle {
            color: #888;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .avatar {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: white;
            font-weight: bold;
            margin: 0 auto 20px;
        }
        .user-info {
            display: grid;
            grid-template-columns: 150px 1fr;
            gap: 10px 20px;
            margin-bottom: 30px;
        }
        .user-info .label {
            font-weight: 600;
            color: #555;
            padding: 8px 0;
        }
        .user-info .value {
            padding: 8px 0;
            color: #333;
            border-bottom: 1px solid #f0f0f0;
        }
        .user-info .value .badge {
            margin: 2px;
        }
        @media (max-width: 576px) {
            .user-info {
                grid-template-columns: 1fr;
                gap: 0;
            }
            .user-info .label {
                padding-bottom: 0;
            }
        }
    </style>
</head>
<body>
<div class="profile-card">
    <div class="text-center">
        <div class="avatar" th:text="${user != null ? user.username.substring(0, 1).toUpperCase() : '?'}"></div>
        <h2 th:text="${user != null ? user.firstName + ' ' + user.lastName : 'Профиль пользователя'}"></h2>
        <p class="subtitle" th:text="${user != null ? '@' + user.username : 'Данные недоступны'}"></p>
    </div>

    <div th:if="${user != null}">
        <div class="user-info">
            <div class="label"><i class="bi bi-hash"></i> ID</div>
            <div class="value" th:text="${user.id}"></div>

            <div class="label"><i class="bi bi-person"></i> Username</div>
            <div class="value" th:text="${user.username}"></div>

            <div class="label"><i class="bi bi-person-badge"></i> First Name</div>
            <div class="value" th:text="${user.firstName}"></div>

            <div class="label"><i class="bi bi-person-badge"></i> Last Name</div>
            <div class="value" th:text="${user.lastName}"></div>

            <div class="label"><i class="bi bi-calendar"></i> Age</div>
            <div class="value" th:text="${user.age}"></div>

            <div class="label"><i class="bi bi-envelope"></i> Email</div>
            <div class="value" th:text="${user.email}"></div>

            <div class="label"><i class="bi bi-shield"></i> Role</div>
            <div class="value">
                    <span th:each="role : ${user.roles}">
                        <span class="badge"
                              th:classappend="${role.name == 'ROLE_ADMIN'} ? 'bg-danger' : 'bg-primary'"
                              th:text="${role.name.replace('ROLE_', '')}"></span>
                    </span>
                <span th:if="${user.roles == null or user.roles.isEmpty()}" class="text-danger">
                        <i class="bi bi-exclamation-triangle"></i> Нет ролей
                    </span>
            </div>
        </div>

        <div class="text-center mt-3">
            <a href="/logout" class="btn btn-danger">
                <i class="bi bi-box-arrow-right"></i> Logout
            </a>
        </div>
    </div>

    <div th:if="${user == null}" class="text-center py-4">
        <div class="display-1 text-muted">😔</div>
        <p class="text-muted">Данные пользователя недоступны</p>
        <a href="/login" class="btn btn-primary mt-3">
            <i class="bi bi-box-arrow-in-right"></i> Войти
        </a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
