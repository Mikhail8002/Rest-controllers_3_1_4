<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <title>Edit user</title>
</head>
<body>
<form th:action="@{/users/edit}" th:object="${user}" method="POST">
    <input name="id" th:field="*{id}" th:value="${user.id}" hidden="hidden">

    <label for="firstName">First Name</label>
    <input type="text" id="firstName" th:field="*{firstName}" th:value="${user.firstName}" required>
    </br>

    <label for="lastName">Last Name</label>
    <input type="text" id="lastName" th:field="*{lastName}" th:value="${user.lastName}" required>
    </br>

    <label for="email">Email</label>
    <input type="text" id="email" th:field="*{email}" th:value="${user.email}" required>
    </br>

    <label for="age">Age</label>
    <input type="number" id="age" th:field="*{age}" th:value="${user.age}" required>
    </br>

    <button type="submit">Update User</button>
</form>
</body>
</html>
