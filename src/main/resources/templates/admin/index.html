<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель администратора</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body>
<!-- Навигация -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/admin"><i class="bi bi-shield-lock"></i> Admin panel</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                        <span class="nav-link text-light">
                            <i class="bi bi-person-circle"></i>
                            <span th:text="${#authentication != null ? #authentication.name : 'Guest'}">admin</span>
                        </span>
                </li>
                <li class="nav-item">
                    <a href="/logout" class="btn btn-danger btn-sm ms-3">
                        <i class="bi bi-box-arrow-right"></i> Logout
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-people"></i> All users</h2>
        <a href="/admin/create" class="btn btn-success">
            <i class="bi bi-person-plus"></i> New User
        </a>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Age</th>
                <th>Email</th>
                <th>Role</th>
                <th>Edit</th>
                <th>Delete</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${users}">
                <td th:text="${user.id}"></td>
                <td th:text="${user.firstName != null ? user.firstName : '-'}"></td>
                <td th:text="${user.lastName != null ? user.lastName : '-'}"></td>
                <td th:text="${user.age != null ? user.age : '-'}"></td>
                <td th:text="${user.email != null ? user.email : '-'}"></td>
                <td>
                            <span th:each="role : ${user.roles}">
                                <span class="badge"
                                      th:classappend="${role.name == 'ROLE_ADMIN'} ? 'bg-danger' : 'bg-primary'"
                                      th:text="${role.name.replace('ROLE_', '')}"></span>
                            </span>
                    <span th:if="${user.roles == null or user.roles.isEmpty()}" class="text-danger">
                                <i class="bi bi-exclamation-triangle"></i> Нет ролей
                            </span>
                </td>
                <td>
                    <a th:href="@{/admin/edit/{id}(id=${user.id})}" class="btn btn-warning btn-sm">
                        <i class="bi bi-pencil"></i> Edit
                    </a>
                </td>
                <td>
                    <a th:href="@{/admin/delete/{id}(id=${user.id})}"
                       class="btn btn-danger btn-sm"
                       onclick="return confirm('Вы уверены, что хотите удалить пользователя?')">
                        <i class="bi bi-trash"></i> Delete
                    </a>
                </td>
            </tr>
            <tr th:if="${users.isEmpty()}">
                <td colspan="8" class="text-center text-muted py-4">
                    <i class="bi bi-inbox"></i> Нет пользователей в системе
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
