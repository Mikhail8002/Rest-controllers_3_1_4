<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 420px;
            width: 100%;
            padding: 40px;
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 36px;
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .login-header h1 {
            color: #333;
            font-size: 24px;
            font-weight: 700;
        }

        .login-header p {
            color: #888;
            font-size: 14px;
            margin-top: 5px;
        }

        /* Сообщения об ошибках */
        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            animation: shake 0.5s ease-in;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .alert-error {
            background: #fde8e8;
            color: #c62828;
            border-left: 4px solid #f44336;
        }

        .alert-success {
            background: #e8f5e9;
            color: #2e7d32;
            border-left: 4px solid #4CAF50;
        }

        .alert .icon {
            font-size: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: #555;
            margin-bottom: 6px;
            font-size: 14px;
        }

        .form-group label .required {
            color: #f44336;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
            font-size: 18px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px 12px 46px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .form-group input::placeholder {
            color: #bbb;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .form-options label {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #666;
            cursor: pointer;
        }

        .form-options label input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .form-options a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }

        .form-options a:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .login-footer {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px solid #f0f0f0;
            color: #888;
            font-size: 13px;
        }

        .login-footer span {
            color: #667eea;
            font-weight: 600;
        }

        /* Показ пароля */
        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #aaa;
            font-size: 18px;
            padding: 5px;
            transition: color 0.3s;
        }

        .toggle-password:hover {
            color: #667eea;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 30px 20px;
            }

            .form-options {
                flex-direction: column;
                gap: 10px;
                align-items: flex-start;
            }

            .login-header h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>

<div class="login-container">
    <!-- Шапка -->
    <div class="login-header">
        <div class="logo">🔐</div>
        <h1>Добро пожаловать</h1>
        <p>Войдите в свою учетную запись</p>
    </div>

    <!-- Сообщения -->
    <div th:if="${param.error}">
        <div class="alert alert-error">
            <span class="icon">❌</span>
            <span>Неверное имя пользователя или пароль</span>
        </div>
    </div>

    <div th:if="${param.logout}">
        <div class="alert alert-success">
            <span class="icon">✅</span>
            <span>Вы успешно вышли из системы</span>
        </div>
    </div>

    <!-- Форма входа -->
    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="username">Имя пользователя <span class="required">*</span></label>
            <div class="input-wrapper">
                <span class="input-icon">👤</span>
                <input type="text"
                       id="username"
                       name="username"
                       placeholder="Введите имя пользователя"
                       required
                       autofocus />
            </div>
        </div>

        <div class="form-group">
            <label for="password">Пароль <span class="required">*</span></label>
            <div class="input-wrapper">
                <span class="input-icon">🔑</span>
                <input type="password"
                       id="password"
                       name="password"
                       placeholder="Введите пароль"
                       required />
                <button type="button" class="toggle-password" onclick="togglePassword()">👁️</button>
            </div>
        </div>

        <div class="form-options">
            <label>
                <input type="checkbox" name="remember-me" />
                Запомнить меня
            </label>
            <a href="#">Забыли пароль?</a>
        </div>

        <button type="submit" class="btn-login">
            <span>🔓</span> Войти
        </button>
    </form>

    <div class="login-footer">
        <p>© 2026 <span>Secure App</span>. Все права защищены.</p>
    </div>
</div>

<script>
    // Переключение видимости пароля
    function togglePassword() {
        const passwordInput = document.getElementById('password');
        const toggleBtn = document.querySelector('.toggle-password');

        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            toggleBtn.textContent = '🙈';
        } else {
            passwordInput.type = 'password';
            toggleBtn.textContent = '👁️';
        }
    }

    // Убираем сообщение об ошибке при вводе
    document.addEventListener('DOMContentLoaded', function() {
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('input', function() {
                const errorAlert = document.querySelector('.alert-error');
                if (errorAlert) {
                    errorAlert.style.display = 'none';
                }
            });
        });
    });
</script>

</body>
</html>
